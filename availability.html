<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A192F">
<!-- 公開準備ができるまで検索結果に出さない。本番公開時にこの1行を削除してください。 -->
<meta name="robots" content="noindex, nofollow">
<title>貸しサロン 空き状況｜Harmonie（アルモ株式会社）</title>
<meta name="description" content="Harmonie（アルモ株式会社）の貸しサロンの空き状況カレンダーです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A192F;
  --card:rgba(16,34,62,.80);
  --card-hover:rgba(24,50,83,.90);
  --glass:rgba(10,25,47,.66);
  --orange:#D85A30;            /* アルモのオレンジ（線・文字以外のアクセント） */
  --orange-deep:#BF4A22;       /* 白文字を載せるボタン用（コントラスト4.5:1以上） */
  --orange-text:#FF9D77;       /* 暗い背景に載せるオレンジ文字 */
  --green:#2ECC71;  --green-text:#5EE29A;
  --red:#E74C3C;    --red-text:#FF9B8F;
  --gray:#64748B;   --gray-text:#B4BECE;
  --white:#fff;
  --sub:rgba(255,255,255,.74);
  --line:rgba(255,255,255,.12);
  --sans:"DM Sans","Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --serif:"Cormorant Garamond","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--white);background:var(--navy);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(180deg,rgba(10,25,47,.35),rgba(10,25,47,.55)),
    url("images/salon_calendar_bg.jpg") center/cover no-repeat,var(--navy);
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #FFB693;outline-offset:2px}

/* ---------- header / footer ---------- */
.site-header{
  max-width:1040px;margin:0 auto;padding:20px 24px 0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo{text-decoration:none;display:block;line-height:1.1}
.logo b{display:block;font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.02em}
.logo small{display:block;margin-top:3px;font-size:11px;color:var(--sub);letter-spacing:.06em}
.header-right{display:flex;align-items:center;gap:20px;font-size:14px}
.tagline{font-family:var(--serif);font-size:20px;color:var(--sub);letter-spacing:.08em}
.back-link{
  text-decoration:none;border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;background:var(--glass);min-height:40px;display:inline-flex;align-items:center;
}
.back-link:hover{background:var(--card-hover)}
.site-footer{max-width:1040px;margin:0 auto;padding:8px 24px 40px;text-align:center;font-size:12px;color:var(--sub)}

/* ---------- panel ---------- */
main{max-width:1040px;margin:0 auto;padding:20px 24px 32px}
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:24px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:40px 44px 28px;
}
h1{margin:0;font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:.03em;line-height:1.3}
.lead{margin:6px 0 20px;color:var(--sub);font-size:14px}

.banner{
  margin:0 0 20px;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;
  border:1px solid var(--orange);background:rgba(216,90,48,.16);
}
.banner.error{border-color:var(--red);background:rgba(231,76,60,.18)}

/* tabs */
.tabs{
  display:flex;max-width:560px;margin:0 auto;padding:4px;gap:4px;
  border:1px solid var(--line);border-radius:14px;background:rgba(16,34,62,.7);
}
.tab{
  flex:1;min-height:48px;border:0;border-radius:10px;background:transparent;cursor:pointer;
  font-weight:500;font-size:16px;letter-spacing:.04em;transition:background .2s;
}
.tab:hover{background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:var(--orange-deep);font-weight:700}
.room-meta{margin:14px 0 0;text-align:center;font-size:15px;color:var(--sub)}
.room-meta span+span::before{content:"｜";margin:0 .6em;opacity:.6}
.room-note{
  max-width:560px;margin:12px auto 0;padding:10px 14px;border-radius:12px;font-size:13.5px;
  background:rgba(16,34,62,.7);border:1px solid var(--line);
}

/* calendar head */
.cal-head{display:flex;align-items:center;justify-content:center;gap:28px;margin:28px 0 18px}
.cal-head h2{
  margin:0;min-width:7.5em;text-align:center;font-family:var(--serif);font-weight:700;
  font-size:44px;line-height:1.2;letter-spacing:.04em;
}
.nav-btn{
  width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(16,34,62,.7);cursor:pointer;display:grid;place-items:center;
  transition:background .2s,border-color .2s;
}
.nav-btn:hover:not(:disabled){background:var(--card-hover);border-color:var(--orange)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* grid */
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.weekdays{margin-bottom:8px}
.weekdays div{text-align:center;font-size:14px;font-weight:700;padding:4px 0}
.weekdays .sun{color:var(--red-text)}
.weekdays .sat{color:#8DB8FF}
.blank{min-height:1px}
.day{
  position:relative;min-height:68px;padding:6px 4px 7px;border-radius:12px;cursor:pointer;
  background:var(--card);border:1.5px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;
  transition:background .15s,border-color .15s,transform .15s;
}
.day:hover:not(:disabled){background:var(--card-hover);transform:translateY(-1px)}
.day .num{font-size:16px;font-weight:700;line-height:1.2}
.day .st{display:flex;align-items:center;justify-content:center;gap:3px;line-height:1.2;min-height:20px;text-align:center}
.day .mark{font-size:16px;font-weight:700}
.day .lab{font-size:12px;font-weight:500;white-space:nowrap}
.day .lab-pc{display:inline}
.day .mark-sm{display:none}

.day.s-open{background:rgba(46,204,113,.10);border-color:rgba(46,204,113,.5)}
.day.s-open .st{color:var(--green-text)}
.day.s-full{background:rgba(231,76,60,.24);border-color:rgba(231,76,60,.75)}
.day.s-full .st{color:var(--red-text)}
.day.s-partial{background:rgba(216,90,48,.20);border-color:var(--orange)}
.day.s-partial .st{color:var(--orange-text)}
.day.s-unknown{background:rgba(100,116,139,.20);border-color:rgba(100,116,139,.55)}
.day.s-unknown .st{color:var(--gray-text)}
.day.s-past{opacity:.38;cursor:default;background:rgba(16,34,62,.55);border-color:transparent}
.day.is-today .num{
  display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:999px;
  background:var(--orange-deep);
}
.day.is-selected{border-color:#fff;box-shadow:0 0 0 2px var(--orange)}

/* legend */
.legend{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.legend li{display:flex;align-items:center;gap:7px}
.legend .m{font-weight:700;font-size:16px}
.legend .g{color:var(--green-text)} .legend .r{color:var(--red-text)}
.legend .o{color:var(--orange-text)} .legend .n{color:var(--gray-text)}
.foot{margin:16px 0 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:12.5px;color:var(--sub)}
.foot a{color:var(--orange-text)}

/* ---------- detail sheet ---------- */
.sheet-root{position:fixed;inset:0;z-index:50;display:none}
.sheet-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(4,10,22,.68)}
.sheet{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,calc(100% - 32px));max-height:88vh;max-height:88dvh;
  display:flex;flex-direction:column;overflow:hidden;
  background:rgba(13,29,54,.97);border:1px solid var(--line);border-radius:20px;
  animation:fadeIn .2s ease;
}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 12px}
.sheet-head h3{margin:0;font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.3}
.chip{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 12px;border-radius:999px;
  font-size:13px;font-weight:500;border:1px solid;
}
.chip.s-open{color:var(--green-text);border-color:rgba(46,204,113,.6);background:rgba(46,204,113,.12)}
.chip.s-full{color:var(--red-text);border-color:rgba(231,76,60,.8);background:rgba(231,76,60,.2)}
.chip.s-partial{color:var(--orange-text);border-color:var(--orange);background:rgba(216,90,48,.18)}
.chip.s-unknown{color:var(--gray-text);border-color:rgba(100,116,139,.7);background:rgba(100,116,139,.2)}
.close-btn{
  flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center;
}
.close-btn:hover{background:rgba(255,255,255,.14)}
.close-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sheet-body{flex:1;overflow-y:auto;padding:4px 22px 14px;-webkit-overflow-scrolling:touch}
.sheet-body h4{margin:6px 0 10px;font-size:15px;font-weight:700}
.sheet-demo{margin:0 0 12px;padding:8px 12px;border-radius:10px;font-size:13px;border:1px solid var(--orange);background:rgba(216,90,48,.16)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slot{
  width:100%;min-height:48px;padding:0 16px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);border:1.5px solid transparent;font-size:15px;
}
.slot .t{font-variant-numeric:tabular-nums;font-weight:500}
.slot .r{font-size:14px;color:var(--green-text);font-weight:700}
.slot:hover:not(:disabled){background:rgba(255,255,255,.12)}
.slot[aria-pressed="true"]{border-color:var(--orange);background:rgba(216,90,48,.22)}
.slot[aria-pressed="true"] .r{color:var(--orange-text)}
.slot:disabled{cursor:default;opacity:.62}
.slot:disabled .r{color:var(--red-text);font-weight:500}
.slot.past .r{color:var(--gray-text)}
.sheet-msg{margin:6px 0;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.06);font-size:14.5px}
.sheet-foot{padding:14px 22px 20px;border-top:1px solid var(--line);background:rgba(10,25,47,.9)}
.summary{margin:0 0 10px;font-size:13.5px;color:var(--sub);min-height:1.5em}
.summary strong{color:var(--white)}
.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;
  border-radius:12px;background:var(--orange-deep);color:#fff;text-decoration:none;
  font-weight:700;font-size:16px;letter-spacing:.03em;transition:background .2s;
}
.cta:hover{background:#A63F1B}
.cta svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tel{display:block;margin-top:10px;text-align:center;font-size:13.5px;color:var(--sub)}
.tel a{color:var(--white)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ---------- mobile ---------- */
@media (max-width:640px){
  body{font-size:15px}
  .site-header{padding:14px 16px 0}
  .logo b{font-size:26px}
  .tagline{display:none}
  main{padding:14px 8px 24px}
  .panel{padding:24px 8px 20px;border-radius:18px}
  h1{font-size:26px;padding:0 8px}
  .lead{padding:0 8px;font-size:14px}
  .tabs,.room-note{margin-left:4px;margin-right:4px}
  .legend,.foot{padding:0 6px}
  .tab{font-size:15px;min-height:48px}
  .cal-head{gap:14px;margin:22px 0 14px}
  .cal-head h2{font-size:32px;min-width:5.5em}
  .weekdays,.days{gap:4px}
  .weekdays div{font-size:13px}
  .day{min-height:56px;padding:5px 1px 5px;border-radius:10px}
  .day .num{font-size:15px}
  .day .mark{font-size:15px}
  .day .lab{font-size:11px}
  .day .lab-pc{display:none}
  .day .mark-sm{display:inline}
  .day.is-today .num{min-width:26px;height:26px}
  .legend{gap:6px 16px;font-size:13.5px}
  .sheet{
    left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:90vh;max-height:90dvh;
    border-radius:20px 20px 0 0;border-bottom:0;animation:slideUp .26s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:10px auto 0;flex:none}
  .sheet-head{padding:12px 18px 10px}
  .sheet-head h3{font-size:26px}
  .sheet-body{padding:4px 18px 12px}
  .sheet-foot{padding:12px 18px 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="site-header">
  <a class="logo" id="logo" href="#"><b>Harmonie</b><small>アルモ株式会社</small></a>
  <div class="header-right">
    <span class="tagline">人と空間を繋ぐ</span>
    <a class="back-link" id="homeLink" href="#">サイトトップへ</a>
  </div>
</header>

<main>
  <section class="panel" aria-labelledby="pageTitle">
    <h1 id="pageTitle">貸しサロン 空き状況</h1>
    <p class="lead">ご希望の部屋を選択し、カレンダーから空き状況をご確認ください。</p>

    <div class="banner" id="demoBanner" hidden>
      <strong>テスト表示中です。</strong>このカレンダーの空き状況はサンプルデータで、実際の予約状況ではありません。
    </div>
    <div class="banner error" id="errorBanner" role="alert" hidden>
      空き状況を読み込めませんでした。時間をおいて再読み込みするか、お問い合わせください。
    </div>

    <div class="tabs" role="tablist" aria-label="部屋の選択" id="tabs">
      <button class="tab" role="tab" id="tab-small" data-room="small" aria-selected="true" aria-controls="calPanel">小部屋</button>
      <button class="tab" role="tab" id="tab-large" data-room="large" aria-selected="false" aria-controls="calPanel" tabindex="-1">大部屋</button>
      <button class="tab" role="tab" id="tab-private" data-room="private" aria-selected="false" aria-controls="calPanel" tabindex="-1">貸し切り</button>
    </div>
    <p class="room-meta" id="roomMeta"></p>
    <p class="room-note" id="roomNote" hidden></p>

    <div id="calPanel" role="tabpanel" aria-labelledby="tab-small">
      <div class="cal-head">
        <button class="nav-btn" id="prevBtn" type="button" aria-label="前の月">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="monthLabel" aria-live="polite"></h2>
        <button class="nav-btn" id="nextBtn" type="button" aria-label="次の月">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
      </div>
      <div class="days" id="days" role="group" aria-label="日付ごとの空き状況"></div>

      <ul class="legend" aria-label="表示の凡例">
        <li><span class="m g" aria-hidden="true">○</span>空きあり</li>
        <li><span class="m r" aria-hidden="true">×</span>満室</li>
        <li><span class="m o" aria-hidden="true">△</span>一部空き（時間表記）</li>
        <li><span class="m n" aria-hidden="true">－</span>情報準備中</li>
      </ul>
      <div class="foot">
        <span id="updated"></span>
        <span>月額での入居をご希望の方は、<a id="monthlyLink" href="#">お問い合わせ</a>ください。</span>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">© Harmonie Co., Ltd.</footer>

<!-- 日付をタップしたときの詳細 -->
<div class="sheet-root" id="sheetRoot">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet">
    <div class="sheet-head">
      <div>
        <h3 id="sheetTitle"></h3>
        <span class="chip" id="sheetChip"></span>
      </div>
      <button class="close-btn" id="closeBtn" type="button" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <p class="summary" id="summary"></p>
      <a class="cta" id="cta" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <span>この日程で空きを問い合わせる</span>
      </a>
      <span class="tel" id="telWrap"></span>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
   * 設定（ここだけ書き換えれば運用できます）
   * ===================================================================== */
  const CONFIG = {
    // 空き状況データの取得先（Google Apps Script のウェブアプリURL）。
    // 空のままだと「サンプル表示」になり、実際の予約状況は一切表示されません。
    gasUrl: 'https://script.google.com/macros/s/AKfycbxCzCiRzBIECPp62zWhPF0HBL8vSpRgB1dLF3aww-gViG-e3iBvu7EIA_j_uQeEdqzU/exec',

    // 将来、別の予約サイトを作ったらそのURLを入れると、メールの代わりにそこへ移動します。
    reservationUrl: '',

    // LINE公式アカウントのベーシックID（例: '@123abcde'）。入れると、問い合わせ先がメールからLINEに変わります。
    // 空のままなら、これまで通りメールです。
    lineId: '@843qmclo',

    contactEmail: 'info@harmo.co.jp',
    contactTel: '090-8648-2850',
    homeUrl: 'https://morisawa-hibiki.github.io/harmo-ver5/',

    // 営業時間（満室・一部空きの判定に使います）。※仮の値です。実際の営業時間に直してください。
    businessHours: { start: 9, end: 21 },

    maxMonthsAhead: 6,          // 何か月先まで閲覧できるか
    sampleMonthsPublished: 3    // サンプル表示のとき、当月を含め何か月分にデータを作るか
  };

  const ROOMS = {
    small:   { label: '小部屋',          price: 1000, people: '1〜2人', cals: ['small'] },
    large:   { label: '和室付き大部屋',  price: 1500, people: '2〜5人', cals: ['large'] },
    private: { label: '貸し切り',        price: 2500, people: '2人〜',  cals: ['small', 'large'],
               extra: '小部屋＋大部屋',
               note: '貸し切りは、小部屋と大部屋の両方が空いている時間のみ表示されます。' }
  };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const STATE_LABEL = { open: '空きあり', full: '満室', partial: '一部空き', unknown: '情報準備中' };

  /* ---------------------------------------------------------------------
   * 日付ユーティリティ（タイムゾーンに依存しない整数計算）
   * --------------------------------------------------------------------- */
  const pad = n => String(n).padStart(2, '0');
  const dstr = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;          // m は 1〜12
  const dow = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(); // その月の日数
  const addMonth = (v, n) => { const i = v.y * 12 + (v.m - 1) + n; return { y: Math.floor(i / 12), m: (i % 12) + 1 }; };
  const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const hm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
  const yen = n => n.toLocaleString('ja-JP') + '円';

  function nowJST() {
    const p = {};
    new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    const y = +p.year, m = +p.month, d = +p.day;
    return { y, m, d, ds: dstr(y, m, d), min: +p.hour * 60 + +p.minute };
  }

  /* ---------------------------------------------------------------------
   * データ取得
   *   データ形式: { updatedAt, publishedUntil: 'YYYY-MM-DD',
   *                 rooms: { small: { busy: { 'YYYY-MM-DD': [['10:00','12:00']] } }, large: {...} } }
   *   busy = 「埋まっている時間」だけ。予定のタイトルなどは一切含みません。
   * --------------------------------------------------------------------- */
  const state = {
    room: 'small', view: null, data: null, demo: false, error: false,
    sheetDate: null, picked: new Set(), lastFocus: null
  };

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // テスト用のサンプル。実際の予約状況ではありません。
  function makeSample(now) {
    const last = addMonth(now, CONFIG.sampleMonthsPublished - 1);
    const publishedUntil = dstr(last.y, last.m, dim(last.y, last.m));
    const rooms = { small: { busy: {} }, large: { busy: {} } };
    const { start, end } = CONFIG.businessHours;
    for (let k = 0; k < CONFIG.sampleMonthsPublished; k++) {
      const v = addMonth(now, k);
      for (let d = 1; d <= dim(v.y, v.m); d++) {
        const ds = dstr(v.y, v.m, d);
        for (const key of ['small', 'large']) {
          const r = hash(key + ds) % 100;
          const blocks = [];
          if (r < 14) {
            blocks.push([hm(start * 60), hm(end * 60)]);
          } else if (r < 44) {
            const n = r < 34 ? 1 : 2;
            let from = start + (hash(ds + key + 'a') % 4);
            for (let i = 0; i < n; i++) {
              const len = 2 + (hash(ds + key + i) % 3);
              const to = Math.min(from + len, end);
              if (from < to) blocks.push([hm(from * 60), hm(to * 60)]);
              from = to + 2;
            }
          }
          if (blocks.length) rooms[key].busy[ds] = blocks;
        }
      }
    }
    return { updatedAt: null, publishedUntil, rooms };
  }

  async function loadData(now) {
    if (!CONFIG.gasUrl) { state.data = makeSample(now); state.demo = true; return; }
    try {
      const res = await fetch(CONFIG.gasUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (!j || !j.rooms || !j.publishedUntil) throw new Error('bad payload');
      state.data = j;
    } catch (e) {
      console.error('availability load failed:', e);
      state.data = null; state.error = true;
    }
  }

  /* ---------------------------------------------------------------------
   * 空き状況の計算
   * --------------------------------------------------------------------- */
  function getDay(roomKey, ds, now) {
    if (ds < now.ds) return { state: 'past' };
    if (!state.data || ds > state.data.publishedUntil) return { state: 'unknown' };
    const busy = ROOMS[roomKey].cals
      .flatMap(c => ((state.data.rooms[c] || {}).busy || {})[ds] || [])
      .map(([s, e]) => [toMin(s), toMin(e)]);
    const slots = [];
    for (let h = CONFIG.businessHours.start; h < CONFIG.businessHours.end; h++) {
      const s = h * 60, e = s + 60;
      let st = 'free';
      if (ds === now.ds && s < now.min) st = 'past';                  // すでに始まっている時間
      else if (busy.some(([bs, be]) => bs < e && be > s)) st = 'busy';
      slots.push({ h, s, e, st });
    }
    const live = slots.filter(x => x.st !== 'past');
    const free = live.filter(x => x.st === 'free');
    const ranges = [];
    free.forEach(x => {
      const last = ranges[ranges.length - 1];
      if (last && last.e === x.s) last.e = x.e; else ranges.push({ s: x.s, e: x.e });
    });
    const st = (live.length === 0 || free.length === 0) ? 'full'
             : free.length === live.length ? 'open' : 'partial';
    const label = ranges.length === 1 ? `${hm(ranges[0].s)}〜${hm(ranges[0].e)}` : '一部空き';
    return { state: st, slots, ranges, label };
  }

  /* ---------------------------------------------------------------------
   * カレンダー描画
   * --------------------------------------------------------------------- */
  const $ = id => document.getElementById(id);
  const daysEl = $('days');

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderMeta() {
    const r = ROOMS[state.room];
    const meta = $('roomMeta');
    meta.textContent = '';
    meta.append(el('span', '', `1時間 ${yen(r.price)}`),
                el('span', '', r.people + (r.extra ? `（${r.extra}）` : '')));
    const note = $('roomNote');
    note.hidden = !r.note;
    note.textContent = r.note || '';
  }

  function renderCalendar() {
    const { y, m } = state.view;
    const now = nowJST();
    $('monthLabel').textContent = `${y}年${m}月`;
    daysEl.textContent = '';
    for (let i = 0; i < dow(y, m, 1); i++) daysEl.append(el('span', 'blank'));

    for (let d = 1; d <= dim(y, m); d++) {
      const ds = dstr(y, m, d);
      const info = getDay(state.room, ds, now);
      const b = el('button', 'day');
      b.type = 'button';
      b.dataset.date = ds;
      b.append(el('span', 'num', String(d)));
      const st = el('span', 'st');
      let aria = `${m}月${d}日 ${WD[dow(y, m, d)]}曜日`;

      if (info.state === 'past') {
        b.classList.add('s-past'); b.disabled = true; aria += ' 受付終了';
      } else {
        b.classList.add('s-' + info.state);
        aria += ' ' + STATE_LABEL[info.state];
        if (info.state === 'open')      st.append(el('span', 'mark', '○'));
        else if (info.state === 'full') st.append(el('span', 'mark', '×'), el('span', 'lab', '満室'));
        else if (info.state === 'partial') {
          st.append(el('span', 'mark mark-sm', '△'), el('span', 'lab lab-pc', info.label));
          aria += ' ' + info.ranges.map(r => `${hm(r.s)}から${hm(r.e)}`).join('、');
        } else st.append(el('span', 'mark', '－'));
      }
      if (ds === now.ds) { b.classList.add('is-today'); aria += '（今日）'; }
      if (ds === state.sheetDate) b.classList.add('is-selected');
      b.setAttribute('aria-label', aria);
      b.append(st);
      daysEl.append(b);
    }

    const min = { y: now.y, m: now.m }, max = addMonth(min, CONFIG.maxMonthsAhead);
    const idx = v => v.y * 12 + v.m;
    $('prevBtn').disabled = idx(state.view) <= idx(min);
    $('nextBtn').disabled = idx(state.view) >= idx(max);

    $('updated').textContent = state.demo ? '※表示はサンプルです'
      : state.data && state.data.updatedAt ? `最終更新：${fmtUpdated(state.data.updatedAt)}` : '';
  }

  function fmtUpdated(iso) {
    const t = new Date(iso);
    if (isNaN(t)) return '';
    return new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(t);
  }

  function moveMonth(n) {
    state.view = addMonth(state.view, n);
    renderCalendar();
  }

  function selectRoom(key, focus) {
    state.room = key;
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.room === key;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    $('calPanel').setAttribute('aria-labelledby', 'tab-' + key);
    closeSheet(false);
    renderMeta();
    renderCalendar();
  }

  /* ---------------------------------------------------------------------
   * 詳細シート
   * --------------------------------------------------------------------- */
  function dateLabel(ds) {
    const [y, m, d] = ds.split('-').map(Number);
    return `${y}年${m}月${d}日（${WD[dow(y, m, d)]}）`;
  }

  function pickedRanges(info) {
    const hours = [...state.picked].sort((a, b) => a - b);
    const out = [];
    hours.forEach(h => {
      const last = out[out.length - 1];
      if (last && last.e === h * 60) last.e += 60; else out.push({ s: h * 60, e: h * 60 + 60 });
    });
    return out;
  }

  function lineUrl(text) {
    return 'https://line.me/R/oaMessage/' + encodeURIComponent(CONFIG.lineId) + '/?' + encodeURIComponent(text);
  }

  function buildCta(info) {
    const room = ROOMS[state.room];
    const ranges = pickedRanges(info);
    const times = ranges.length ? ranges.map(r => `${hm(r.s)}〜${hm(r.e)}`).join('、') : '（ご希望の時間をご記入ください）';
    const test = state.demo ? '【テスト】' : '';
    if (CONFIG.lineId) {
      const hours = state.picked.size;
      const lines = [
        `${test}【貸しサロン】空き状況のお問い合わせ`,
        `■ご希望の部屋：${room.label}`,
        `■ご利用日：${dateLabel(state.sheetDate)}`,
        `■ご希望の時間：${times}`
      ];
      if (ranges.length) lines.push(`■料金の目安：${yen(room.price * hours)}`);
      lines.push('■ご利用人数：', '■お名前：', '■ご利用目的：');
      if (state.demo) lines.push('※サンプル表示からのテスト送信です。');
      return lineUrl(lines.join('\n'));
    }
    if (CONFIG.reservationUrl) {
      const u = new URL(CONFIG.reservationUrl, location.href);
      u.searchParams.set('room', state.room);
      u.searchParams.set('date', state.sheetDate);
      if (ranges.length) u.searchParams.set('time', ranges.map(r => `${hm(r.s)}-${hm(r.e)}`).join(','));
      return u.toString();
    }
    const subject = `${test}【貸しサロン】空き状況のお問い合わせ ${dateLabel(state.sheetDate)} ${room.label}`;
    const body = [
      'Harmonie 貸しサロンご担当者様', '',
      '下記の日程でご利用できるか、確認をお願いします。', '',
      `■ご希望の部屋：${room.label}`,
      `■ご利用日：${dateLabel(state.sheetDate)}`,
      `■ご希望の時間：${times}`,
      '■ご利用人数：',
      '■お名前：',
      '■ご連絡先（電話またはメール）：',
      '■ご利用目的：', '',
      state.demo ? '※サンプル表示からのテスト送信です。' : '※サイトの空き状況を見て送信しています。'
    ].join('\n');
    return `mailto:${CONFIG.contactEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  function updateFooter(info) {
    const room = ROOMS[state.room];
    const ranges = pickedRanges(info);
    const summary = $('summary');
    summary.textContent = '';
    if (ranges.length) {
      const hours = state.picked.size;
      summary.append('選択中：', el('strong', '', ranges.map(r => `${hm(r.s)}〜${hm(r.e)}`).join('、')),
        `（${hours}時間・目安 ${yen(room.price * hours)}）`);
    } else {
      summary.textContent = info.state === 'unknown'
        ? 'この日の空き状況は準備中です。お気軽にお問い合わせください。'
        : '時間を選ぶと、お問い合わせ文に入ります（選ばなくても送れます）。';
    }
    const cta = $('cta');
    cta.href = buildCta(info);
    if (CONFIG.lineId) {
      cta.target = '_blank'; cta.rel = 'noopener';
      cta.querySelector('span').textContent = 'LINEでこの日程を相談する';
    }
  }

  function openSheet(ds, trigger) {
    state.sheetDate = ds;
    state.picked = new Set();
    state.lastFocus = trigger || null;
    const info = getDay(state.room, ds, nowJST());

    $('sheetTitle').textContent = dateLabel(ds);
    const chip = $('sheetChip');
    chip.className = 'chip s-' + info.state;
    chip.textContent = (info.state === 'open' ? '○ ' : info.state === 'full' ? '× ' : info.state === 'partial' ? '△ ' : '－ ')
      + STATE_LABEL[info.state] + (info.state === 'open' ? '（全時間帯）' : '');

    const body = $('sheetBody');
    body.textContent = '';
    if (state.demo) body.append(el('p', 'sheet-demo', 'サンプル表示です。実際の空き状況ではありません。'));
    const room = ROOMS[state.room];
    if (info.state === 'unknown') {
      body.append(el('p', 'sheet-msg', 'この日の空き状況は、まだ公開していません。ご希望の日時を添えて、お問い合わせください。'));
    } else {
      body.append(el('h4', '', `${room.label}の時間帯`));
      const ul = el('ul', 'slots');
      info.slots.forEach(s => {
        const li = document.createElement('li');
        const b = el('button', 'slot');
        b.type = 'button';
        b.append(el('span', 't', `${hm(s.s)} - ${hm(s.e)}`));
        if (s.st === 'free') {
          b.append(el('span', 'r', '○ 空き'));
          b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', () => {
            const on = !state.picked.has(s.h);
            on ? state.picked.add(s.h) : state.picked.delete(s.h);
            b.setAttribute('aria-pressed', on);
            b.querySelector('.r').textContent = on ? '✓ 選択中' : '○ 空き';
            updateFooter(info);
          });
        } else {
          b.disabled = true;
          if (s.st === 'past') b.classList.add('past');
          b.append(el('span', 'r', s.st === 'past' ? '受付終了' : '× 予約済み'));
        }
        li.append(b); ul.append(li);
      });
      body.append(ul);
    }
    body.scrollTop = 0;

    const tel = $('telWrap');
    tel.textContent = '';
    if (CONFIG.contactTel) {
      const a = el('a', '', CONFIG.contactTel);
      a.href = 'tel:' + CONFIG.contactTel.replace(/[^0-9+]/g, '');
      tel.append('お電話でのお問い合わせ：', a);
    }
    updateFooter(info);

    $('sheetRoot').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.querySelectorAll('.day.is-selected').forEach(n => n.classList.remove('is-selected'));
    const cell = daysEl.querySelector(`[data-date="${ds}"]`);
    if (cell) cell.classList.add('is-selected');
    $('closeBtn').focus();
  }

  function closeSheet(restoreFocus = true) {
    if (!$('sheetRoot').classList.contains('open')) { state.sheetDate = null; return; }
    $('sheetRoot').classList.remove('open');
    document.body.style.overflow = '';
    const ds = state.sheetDate;
    state.sheetDate = null;
    const cell = daysEl.querySelector(`[data-date="${ds}"]`);
    if (cell) cell.classList.remove('is-selected');
    if (restoreFocus && cell) cell.focus();
  }

  /* ---------------------------------------------------------------------
   * イベント
   * --------------------------------------------------------------------- */
  function bind() {
    $('prevBtn').addEventListener('click', () => moveMonth(-1));
    $('nextBtn').addEventListener('click', () => moveMonth(1));

    daysEl.addEventListener('click', e => {
      const b = e.target.closest('.day');
      if (b && !b.disabled) openSheet(b.dataset.date, b);
    });
    // 矢印キーで日付を移動
    daysEl.addEventListener('keydown', e => {
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
      const b = e.target.closest('.day');
      if (!step || !b) return;
      const [y, m, d] = b.dataset.date.split('-').map(Number);
      const next = daysEl.querySelector(`[data-date="${dstr(y, m, d + step)}"]`);
      if (next && !next.disabled) { e.preventDefault(); next.focus(); }
    });

    const tabs = [...document.querySelectorAll('.tab')];
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => selectRoom(t.dataset.room, false));
      t.addEventListener('keydown', e => {
        const j = e.key === 'ArrowRight' ? (i + 1) % 3 : e.key === 'ArrowLeft' ? (i + 2) % 3 : -1;
        if (j >= 0) { e.preventDefault(); selectRoom(tabs[j].dataset.room, true); }
      });
    });

    $('closeBtn').addEventListener('click', () => closeSheet());
    $('backdrop').addEventListener('click', () => closeSheet());
    document.addEventListener('keydown', e => {
      if (!$('sheetRoot').classList.contains('open')) return;
      if (e.key === 'Escape') { closeSheet(); return; }
      if (e.key === 'Tab') {                       // シート内にフォーカスを閉じ込める
        const f = [...$('sheet').querySelectorAll('button:not(:disabled), a[href]')];
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
  }

  async function init() {
    const now = nowJST();
    $('homeLink').href = CONFIG.homeUrl;
    $('logo').href = CONFIG.homeUrl;
    if (CONFIG.lineId) {
      $('monthlyLink').href = lineUrl('【貸しサロン】月額入居のお問い合わせ');
      $('monthlyLink').target = '_blank'; $('monthlyLink').rel = 'noopener';
    } else $('monthlyLink').href = `mailto:${CONFIG.contactEmail}?subject=${encodeURIComponent('【貸しサロン】月額入居のお問い合わせ')}`;
    state.view = { y: now.y, m: now.m };
    bind();
    renderMeta();
    $('days').textContent = '読み込み中…';
    await loadData(now);
    $('demoBanner').hidden = !state.demo;
    $('errorBanner').hidden = !state.error;
    renderCalendar();
  }
  init();
})();
</script>
</body>
</html>
